# This workflow builds and pushes the Docker image for the Next.js service to Docker Hub.

name: Docker CI for Metaforiq Next Service
run-name: v${{ github.event.client_payload.version }}

on:
  repository_dispatch:
    types: [version-bumped]

jobs:
  build-and-push-next-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Read version
        id: pkg
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/metaforiq-next:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/metaforiq-next:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/metaforiq-next:${{ steps.pkg.outputs.version }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
